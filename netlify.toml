# GitHub: https://github.com/Filiat72/cabs — production branch: master
# Production branch is NOT read from this file — only in Netlify UI:
# Site configuration → Build & deploy → Branches and deploy contexts
# → Production branch = "master" (this repo does not use "main").

[build]
  command = "mise install && npm run build:netlify"
  publish = "build/netlify"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"