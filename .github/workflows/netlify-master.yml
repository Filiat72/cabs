# Deploy from GitHub branch "master" (repo has no "main").
# Add repo secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# Netlify UI must set Production branch to "master" OR rely on this workflow only.
name: Netlify deploy (master)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Build static site
        run: npm run build:netlify

      - name: Publish to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=build/netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}