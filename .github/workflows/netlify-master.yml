# Optional: manual deploy via CLI (after creating a new Netlify site).
# For normal deploys use Netlify → Import Git → github.com/Filiat72/cabs, branch master.
# Secrets (new site): NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
name: Netlify deploy (master)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Build static site
        run: npm run build:netlify

      - name: Publish to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=build/netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}